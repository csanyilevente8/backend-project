name: Backend CD

# Builds and pushes the Spring backend image ("backend") after "Backend CI"
# succeeds on main. It does NOT deploy.
#
# The Go backend is the live/default backend, and the go-backend-project CD owns
# the `helm upgrade` for the shared release. This workflow must not run
# helm upgrade: the release pins backend.image.repository=go-backend, so setting
# backend.image.tag to a Spring SHA here would point the go-backend image at a
# non-existent tag (ImagePullBackOff). The Spring image is kept available in
# Artifact Registry only for manual A/B swaps via --set.
on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [ main ]

# Required for Workload Identity Federation: the job mints a GitHub OIDC token
# that Google Cloud exchanges for short-lived credentials (no long-lived keys).
permissions:
  contents: read
  id-token: write

env:
  PROJECT: project-f0ad4dfa-b194-4dc6-963
  REGION: europe-central2
  AR_REPO: kubecourse
  IMAGE: backend
  WIF_PROVIDER: projects/860228474942/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOYER_SA: github-deployer@project-f0ad4dfa-b194-4dc6-963.iam.gserviceaccount.com

jobs:
  build-and-push:
    name: Build and push image (no deploy)
    runs-on: ubuntu-latest
    # Only proceed if the triggering CI run actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Log Docker in to Artifact Registry
        run: |
          echo "${{ steps.auth.outputs.access_token }}" \
            | docker login -u oauth2accesstoken --password-stdin https://${REGION}-docker.pkg.dev

      - name: Build and push image (linux/amd64, tagged with commit SHA)
        run: |
          SHA=$(git rev-parse --short HEAD)
          IMG="${REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/${IMAGE}:${SHA}"
          echo "Building $IMG"
          # GitHub runners are amd64; --platform is an explicit guard so the
          # image always matches the GKE nodes.
          docker build --platform linux/amd64 -t "$IMG" .
          docker push "$IMG"
          echo "Pushed $IMG (not deployed; deploy is owned by go-backend CD)."
